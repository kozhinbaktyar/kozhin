<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بەڕێوەبردنی قوتابیان - سیستەمی غایبات</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 0;
        }
        .top-bar {
            background: #16324f; padding: 10px 24px; box-sizing: border-box;
            display: flex; justify-content: space-between; align-items: center; font-size: 13px;
            color: #cfe4f0;
        }
        .top-bar a { color: #8fc7e3; text-decoration: none; margin-inline-start: 14px; }
        .top-bar a:hover { text-decoration: underline; }
        .top-bar .role-tag {
            background: #2ecc71; color: #0f2740; font-size: 11px; font-weight: bold;
            padding: 2px 8px; border-radius: 10px; margin-left: 6px;
        }
        .top-bar .role-tag.admin { background: #f1c40f; }
        .top-bar button {
            background: none; border: 1px solid #445; color: #ccc; padding: 4px 12px;
            border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 12px;
        }
        .top-bar button:hover { background: #c0392b; border-color: #c0392b; color: white; }
        .page-wrap { padding: 20px; }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2, h3, h4 { color: #2c3e50; }
        input[type="text"], input[type="file"], select {
            width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;
        }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        table, th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #34495e; color: white; }
        button { padding: 6px 12px; border: none; cursor: pointer; border-radius: 4px; margin: 2px; }
        .btn-save { background: #27ae60; color: white; width: 100%; padding: 12px; font-size: 16px; }
        .btn-cancel-edit { background: #95a5a6; color: white; width: 100%; padding: 10px; font-size: 14px; margin-top: 6px; display: none; }
        .btn-edit { background: #2980b9; color: white; }
        .btn-delete { background: #c0392b; color: white; }
        .btn-pdf { background: #8e44ad; color: white; }
        .btn-link { background: #16a085; color: white; }

        .edit-banner {
            display: none; background: #fff3cd; color: #7a5c00; padding: 8px 12px;
            border-radius: 5px; margin-bottom: 10px; font-size: 14px;
        }
        /* گەورەکردنی قەبارەی وێنەی پێشوەختە بۆ 160 لە 160 پیکسڵ */
        .img-preview { width: 160px; height: 160px; object-fit: cover; border-radius: 8px; display: none; margin-top: 10px; border: 2px solid #ccc; }

        .card-scan-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .card-scan-row input#card-id { flex: 1; min-width: 160px; margin: 8px 0; }
        .card-scan-row button { white-space: nowrap; font-size: 13px; padding: 9px 12px; }
        .btn-scan-connect { background: #16a085; color: white; }
        .btn-scan-disconnect { background: #e74c3c; color: white; }
        .scan-status { font-size: 12px; color: #888; margin: -4px 0 10px; }
        .scan-status.connected { color: #16a085; font-weight: bold; }
        .scan-status.scanned { color: #2980b9; font-weight: bold; }
        #card-id.just-scanned { border-color: #16a085; background: #eafaf3; }

        .filter-row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .filter-row input, .filter-row select { flex: 1; min-width: 200px; margin: 0; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div>
            <span class="role-tag" id="role-tag">...</span>
            <span id="staff-name-label">چاوەڕوانبە...</span>
        </div>
        <div>
            <a href="home.html">🏠 سەرەکی</a>
            <a href="admin.html">📊 پانێڵی بەڕێوەبەر</a>
            <a href="scanner.html">📡 سکانەر</a>
            <button id="btn-logout">چوونەدەرەوە</button>
        </div>
    </div>

    <div class="page-wrap">
        <div class="container">
            <h2>بەڕێوەبردنی قوتابیان (تۆمارکردن و دەستکاری)</h2>
            
            <div class="edit-banner" id="edit-banner">✏️ لە دۆخی دەستکاریکردنیت بۆ قوتابییەکی هەبوو</div>
            <form id="student-form">
                <div class="card-scan-row">
                    <input type="text" id="card-id" placeholder="ژمارەی کارت (RFID)" required>
                    <button type="button" id="btn-scan-connect" class="btn-scan-connect">📡 پەیوەستکردنی کارتخوێن</button>
                    <button type="button" id="btn-scan-disconnect" class="btn-scan-disconnect" style="display:none;">بڕینی پەیوەندی</button>
                </div>
                <div class="scan-status" id="scan-status">کارتخوێن پەیوەست نییە — دەتوانیت ژمارەی کارت بە دەست بنووسیت یان کارتخوێن پەیوەست بکەیت</div>
                <input type="text" id="student-name" placeholder="ناوی تەواو" required>
                <input type="text" id="student-class" placeholder="پۆل" required>

                <div class="image-section">
                    <label>وێنەی قوتابی (ئەگەر بیهێڵیتەوە بەتاڵ لە کاتی دەستکاریکردن، وێنەی پێشوو دەمێنێتەوە):</label>
                    <input type="file" id="student-file" accept="image/*">
                    <video id="webcam" autoplay playsinline style="width:180px; display:none;"></video>
                    <button type="button" id="btn-capture">کردنەوەی کامێرا</button>
                    <button type="button" id="btn-take-pic" style="display:none;">گرتنی وێنە</button>
                    <canvas id="canvas" style="display:none;"></canvas>
                    <br>
                    <img id="img-preview" class="img-preview">
                </div>
                <button type="submit" class="btn-save">پاشکەوتکردن / نوێکردنەوە</button>
                <button type="button" class="btn-cancel-edit" id="btn-cancel-edit">پاشگەزبوونەوە لە دەستکاریکردن</button>
            </form>

            <hr style="margin: 30px 0;">

            <h3>لیستی گشتی قوتابییان</h3>
            <div class="filter-row">
                <input type="text" id="student-search" placeholder="گەڕان بە ناو یان ژمارەی کارت...">
                <select id="class-filter">
                    <option value="">هەموو پۆلەکان</option>
                </select>
            </div>
            <table>
                <thead>
                    <tr><th>کارت</th><th>ناو</th><th>پۆل</th><th>لینکی بەخێوکەر</th><th>کردارەکان</th></tr>
                </thead>
                <tbody id="all-students-table-body"></tbody>
            </table>
        </div>
    </div>

    <!-- بارکردنی کتابخانەی PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script type="module">
        import { app } from "./firebase-config.js";
        import { requireStaffAuth, logout } from "./auth-guard.js";
        import { 
            getDatabase, ref, set, get, child, onValue, remove, update 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const db = getDatabase(app);

        const staff = await requireStaffAuth({ requireAdmin: true });
        const isAdmin = true;
        document.getElementById('staff-name-label').innerText = staff.name;
        const roleTagEl = document.getElementById('role-tag');
        roleTagEl.innerText = isAdmin ? 'بەڕێوەبەر' : 'ستاف';
        if (isAdmin) roleTagEl.classList.add('admin');
        document.getElementById('btn-logout').addEventListener('click', logout);

        function generateLinkCode(len = 14) {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            const arr = new Uint32Array(len);
            crypto.getRandomValues(arr);
            return Array.from(arr, n => chars[n % chars.length]).join('');
        }

        let capturedImageBase64 = null;
        let editingCardId = null;
        let studentsCache = [];
        let studentsLoaded = false;

        // کامێرا
        let webcamStream = null;
        document.getElementById('btn-capture').addEventListener('click', startWebcam);
        document.getElementById('btn-take-pic').addEventListener('click', takeSnapshot);

        async function startWebcam() {
            const video = document.getElementById('webcam');
            document.getElementById('btn-take-pic').style.display = 'inline-block';
            try {
                webcamStream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = webcamStream;
                video.style.display = 'block';
            } catch (e) {
                alert("نەتوانرا کامێرا بکرێتەوە: " + e);
            }
        }

        function takeSnapshot() {
            const video = document.getElementById('webcam');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            capturedImageBase64 = canvas.toDataURL('image/jpeg');
            showPreview(capturedImageBase64);
            stopWebcam();
        }

        function stopWebcam() {
            if (webcamStream) {
                webcamStream.getTracks().forEach(track => track.stop());
                webcamStream = null;
            }
            document.getElementById('webcam').style.display = 'none';
            document.getElementById('btn-take-pic').style.display = 'none';
        }

        function showPreview(src) {
            const img = document.getElementById('img-preview');
            img.src = src;
            img.style.display = 'inline-block';
        }

        // کارتخوێن (Serial)
        let scanPort = null;
        let scanReader = null;
        let scanKeepReading = false;

        const btnScanConnect = document.getElementById('btn-scan-connect');
        const btnScanDisconnect = document.getElementById('btn-scan-disconnect');
        const scanStatusEl = document.getElementById('scan-status');
        const cardIdInput = document.getElementById('card-id');

        if (!("serial" in navigator)) {
            btnScanConnect.disabled = true;
            scanStatusEl.innerText = "ئەم وێبگەڕە پشتگیری کارتخوێن ناکات (Chrome یان Edge بەکاربهێنە)";
        }

        btnScanConnect.addEventListener('click', async () => {
            try {
                scanPort = await navigator.serial.requestPort();
                await scanPort.open({ baudRate: 9600 });
                scanStatusEl.innerText = "کارتخوێن پەیوەستە 🟢 — کارتەکە دابنێ...";
                scanStatusEl.classList.add('connected');
                btnScanConnect.style.display = 'none';
                btnScanDisconnect.style.display = 'inline-block';
                scanKeepReading = true;
                readCardScanner();
            } catch (e) {
                scanStatusEl.innerText = "پەیوەستکردن سەرکەوتوو نەبوو: " + e;
            }
        });

        btnScanDisconnect.addEventListener('click', disconnectCardReader);

        async function disconnectCardReader() {
            scanKeepReading = false;
            try {
                if (scanReader) { await scanReader.cancel(); scanReader.releaseLock(); scanReader = null; }
                if (scanPort) { await scanPort.close(); scanPort = null; }
            } catch (e) {}
            scanStatusEl.innerText = "کارتخوێن پەیوەست نییە";
            scanStatusEl.classList.remove('connected', 'scanned');
            btnScanConnect.style.display = 'inline-block';
            btnScanDisconnect.style.display = 'none';
        }

        async function readCardScanner() {
            while (scanPort && scanPort.readable && scanKeepReading) {
                const textDecoder = new TextDecoderStream();
                scanPort.readable.pipeTo(textDecoder.writable);
                scanReader = textDecoder.readable.getReader();
                try {
                    while (scanKeepReading) {
                        const { value, done } = await scanReader.read();
                        if (done) break;
                        if (value) {
                            const cleanCardId = value.trim();
                            if (cleanCardId.length > 3) {
                                cardIdInput.value = cleanCardId;
                                scanStatusEl.innerText = "✅ کارت خوێندرایەوە: " + cleanCardId;
                                scanStatusEl.classList.add('scanned');
                            }
                        }
                    }
                } catch (error) {} finally { try { scanReader.releaseLock(); } catch(e){} }
            }
        }

        document.getElementById('student-file').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => { capturedImageBase64 = reader.result; showPreview(capturedImageBase64); };
            reader.readAsDataURL(file);
        });

        function resetForm() {
            editingCardId = null;
            capturedImageBase64 = null;
            document.getElementById('student-form').reset();
            document.getElementById('card-id').disabled = false;
            document.getElementById('img-preview').style.display = 'none';
            document.getElementById('edit-banner').style.display = 'none';
            document.getElementById('btn-cancel-edit').style.display = 'none';
            stopWebcam();
        }

        function loadStudentForEdit(student) {
            editingCardId = student.cardId;
            capturedImageBase64 = null;
            document.getElementById('card-id').value = student.cardId;
            document.getElementById('card-id').disabled = true;
            document.getElementById('student-name').value = student.name || '';
            document.getElementById('student-class').value = student.class || '';
            if (student.imageUrl) { showPreview(student.imageUrl); }
            else { document.getElementById('img-preview').style.display = 'none'; }
            document.getElementById('edit-banner').style.display = 'block';
            document.getElementById('btn-cancel-edit').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.getElementById('btn-cancel-edit').addEventListener('click', resetForm);

        document.getElementById('student-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const cardId = document.getElementById('card-id').value.trim();
            const name = document.getElementById('student-name').value.trim();
            const sClass = document.getElementById('student-class').value.trim();
            if (!cardId || !name || !sClass) return;

            const submitBtn = document.querySelector('#student-form .btn-save');
            submitBtn.disabled = true;
            submitBtn.textContent = 'چاوەڕوانبە...';

            try {
                let payload = { cardId, name, class: sClass };
                if (editingCardId) {
                    const oldSnap = await get(child(ref(db), `students/${cardId}`));
                    if (oldSnap.exists()) payload = { ...oldSnap.val(), ...payload };
                } else {
                    payload.linkCode = generateLinkCode();
                    payload.parentJoined = false;
                }
                if (capturedImageBase64) payload.imageUrl = capturedImageBase64;

                await set(ref(db, 'students/' + cardId), payload);
                alert("قوتابی پاشکەوتکرا!" + (!editingCardId ? `\n\nکۆدی بەستنەوەی بەخێوکەر: ${payload.linkCode}` : ''));
                resetForm();
            } catch (err) {
                alert("هەڵە لە پاشکەوتکردن: " + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'پاشکەوتکردن / نوێکردنەوە';
            }
        });

        // کارکردنی فلتەر و گەڕان بەیەکەوە
        function filterAndRender() {
            const query = document.getElementById('student-search').value.trim().toLowerCase();
            const selectedClass = document.getElementById('class-filter').value;
            const rows = document.querySelectorAll('#all-students-table-body tr');

            rows.forEach(row => {
                const nameText = row.children[1].innerText.toLowerCase();
                const cardText = row.children[0].innerText.toLowerCase();
                const classText = row.children[2].innerText;

                const matchesSearch = nameText.includes(query) || cardText.includes(query);
                const matchesClass = !selectedClass || classText === selectedClass;

                if (matchesSearch && matchesClass) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }

        document.getElementById('student-search').addEventListener('input', filterAndRender);
        document.getElementById('class-filter').addEventListener('change', filterAndRender);

        onValue(ref(db, 'students'), (snapshot) => {
            studentsCache = [];
            if (snapshot.exists()) {
                const data = snapshot.val();
                Object.keys(data).forEach(k => studentsCache.push(data[k]));
            }
            studentsLoaded = true;
            updateClassDropdown();
            renderTable();
        });

        function updateClassDropdown() {
            const classFilter = document.getElementById('class-filter');
            const currentSelected = classFilter.value;
            
            // کۆکردنەوەی پۆلەکان بە بێ دووبارەبوونەوە
            const classes = [...new Set(studentsCache.map(s => s.class))].filter(Boolean).sort();
            
            classFilter.innerHTML = '<option value="">هەموو پۆلەکان</option>';
            classes.forEach(cls => {
                const opt = document.createElement('option');
                opt.value = cls;
                opt.textContent = cls;
                if (cls === currentSelected) opt.selected = true;
                classFilter.appendChild(opt);
            });
        }

        function renderTable() {
            const allStudentsTable = document.getElementById('all-students-table-body');
            allStudentsTable.innerHTML = '';

            studentsCache.forEach(student => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${student.cardId}</td>
                    <td>${student.name}</td>
                    <td>${student.class}</td>
                    <td><button class="btn-link" data-copy="${student.linkCode}">📋 کۆپی کۆد</button></td>
                    <td>
                        <button class="btn-edit" data-card="${student.cardId}">دەستکاری</button>
                        <button class="btn-pdf" data-card="${student.cardId}">PDF</button>
                        <button class="btn-delete" data-card="${student.cardId}">سڕینەوە</button>
                    </td>`;
                allStudentsTable.appendChild(row);
            });
            filterAndRender();
        }

        document.getElementById('all-students-table-body').addEventListener('click', (e) => {
            const btn = e.target;
            const cardId = btn.dataset.card;
            const student = studentsCache.find(s => s.cardId === cardId);

            if (btn.classList.contains('btn-link')) {
                navigator.clipboard.writeText(btn.dataset.copy);
                btn.textContent = '✔ کۆپی کرا';
                setTimeout(() => btn.textContent = '📋 کۆپی کۆد', 1500);
            }
            if (student && btn.classList.contains('btn-edit')) loadStudentForEdit(student);
            if (student && btn.classList.contains('btn-pdf')) {
                const el = document.createElement('div');
                el.style.direction = 'rtl';
                el.innerHTML = `<h1>ڕاپۆرتی قوتابی: ${student.name}</h1><p>پۆل: ${student.class}</p><p>کارت: ${student.cardId}</p>`;
                html2pdf().from(el).save(`${student.name}_ڕاپۆرت.pdf`);
            }
            if (student && btn.classList.contains('btn-delete')) {
                if (confirm(`دڵنیای لە سڕینەوەی "${student.name}"؟`)) {
                    remove(ref(db, `students/${student.cardId}`));
                }
            }
        });
    </script>
</body>
</html>
